name: refresh profile artwork

# The README is six static SVG files, so nothing can be live at view time.
# This rebuilds them once a day from the GitHub API and the contribution
# calendar. The terminal carries a real login timestamp, so the drawing moves
# every day and the commit always lands.
#
# The cron is set about six hours before the time the refresh should show up.
# GitHub delivers the schedule event hours late, measured at 3.8 to 7.0 hours
# across 37 consecutive days with a median of 6.2 in the last fortnight. That
# is their scheduler, not something this file can fix, so 47 17 lands around
# 07:00 in Jakarta. Re-measure with gh run list and move the hour if the drift
# changes.

on:
  schedule:
    - cron: "47 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redraw the windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 assets/build.py

      - name: Commit whatever moved
        run: |
          git config user.name "Kevin Praditiansyah"
          git config user.email "kevinpradithh@gmail.com"
          git add assets
          git diff --cached --quiet && echo "nothing changed today" && exit 0
          git commit -m "chore: refresh the profile artwork from today's GitHub data"
          git push
