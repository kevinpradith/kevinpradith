<title id="t">The toolbox folder in Finder</title>
<desc id="d">A macOS Finder window in list view, with toolbox selected in the sidebar. It lists: TypeScript, Language, apps and CLIs that share one core; Node, Runtime, build scripts and CLI entry points; PowerShell, Shell, Windows tooling, snipsearch; Python, Language, glue, generators, quick analysis; Burp Suite, Proxy, every request in an engagement; Docker, Container, reproducible test environments; Kubernetes, Orchestrator, lab clusters on MicroK8s; WSL, Subsystem, Linux tooling on a Windows machine.</desc>
