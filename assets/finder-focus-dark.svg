<title id="t">The focus folder in Finder</title>
<desc id="d">A macOS Tahoe Finder window in list view, with focus selected in the sidebar. It lists: authorization.md, Bug class, IDOR, tenant isolation, privilege boundaries; ssrf.md, Bug class, internal metadata, blind callbacks, filter bypass; exposed-config.md, Bug class, leaked env, build manifests, open storage; local-first.md, Principle, if it runs in the browser it needs no server; reporting.md, Principle, reproducible steps, demonstrated impact.</desc>
